services:
  - type: web
    name: promaia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m promaia dev
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WHITELIST
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_SECRET
        sync: false
      - key: DASHBOARD_AUTH_TOKEN
        sync: false
      - key: PYTHON_ENV
        value: "production"
      - key: PORT
        value: "8000"