<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Promaia{% endblock %}</title>

    <!-- Superflat fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Page base styles: loads BEFORE skin CSS so skins always win -->
    {% block head %}{% endblock %}

    <!-- Skin CSS loads LAST: overrides all base layout -->
    <link rel="stylesheet" href="/static/skins/{{ skin }}.css">

    <style>
        /* === Minimal reset — skins own everything else === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body, sans-serif);
            background: var(--bg-primary, #F4F0E8);
            color: var(--text-primary, #2C2C2C);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        ul, ol { list-style: none; }

        .atmosphere {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-shell {
            max-width: var(--page-max-width, 1120px);
            margin: 0 auto;
            padding: var(--page-pad-y, 24px) var(--page-pad-x, 16px);
            position: relative;
            z-index: 1;
        }
        @media (min-width: 768px) {
            .page-shell {
                padding: var(--page-pad-y-lg, 48px) var(--page-pad-x-lg, 32px);
            }
        }

        .notification-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            background: var(--accent-primary, #E63946);
            color: #fff;
            font-family: var(--font-mono, 'JetBrains Mono', monospace);
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 12px;
            padding: 0 8px;
            display: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: opacity 0.2s ease;
        }
        .notification-badge.visible { display: block; }
        .notification-badge:hover { opacity: 0.85; }

    </style>
</head>
<body class="{{ skin }}" data-skin="{{ skin }}">
    <div class="notification-badge" id="notif-badge" title="Unread notifications" onclick="window.location='/dashboard'"></div>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="page-shell">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
    <script>
    (function() {
        var badge = document.getElementById('notif-badge');
        if (!badge) return;
        function poll() {
            fetch('/api/notifications/unread')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.unread > 0) {
                        badge.textContent = d.unread;
                        badge.classList.add('visible');
                    } else {
                        badge.classList.remove('visible');
                    }
                })
                .catch(function() {});
        }
        poll();
        setInterval(poll, 60000);
    })();
    </script>
    <script src="/static/js/atmospherics.js" defer></script>
</body>
</html>
