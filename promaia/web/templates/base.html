<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Promaia{% endblock %}</title>

    <!-- Superflat fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Page base styles: loads BEFORE skin CSS so skins always win -->
    {% block head %}{% endblock %}

    <!-- Skin CSS loads LAST: overrides all base layout -->
    <link rel="stylesheet" href="/static/skins/{{ skin }}.css">

    <style>
        /* === Minimal reset — skins own everything else === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body, sans-serif);
            background: var(--bg-primary, #F4F0E8);
            color: var(--text-primary, #2C2C2C);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        ul, ol { list-style: none; }

        .atmosphere {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .page-shell {
            max-width: var(--page-max-width, 1120px);
            margin: 0 auto;
            padding: var(--page-pad-y, 24px) var(--page-pad-x, 16px);
            position: relative;
            z-index: 1;
        }
        @media (min-width: 768px) {
            .page-shell {
                padding: var(--page-pad-y-lg, 48px) var(--page-pad-x-lg, 32px);
            }
        }

    </style>
</head>
<body class="{{ skin }}" data-skin="{{ skin }}">
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="page-shell">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
    <script src="/static/js/atmospherics.js" defer></script>
</body>
</html>
