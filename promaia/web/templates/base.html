<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Promaia{% endblock %}</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="theme-color" content="#FF3366">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Superflat fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Page base styles: loads BEFORE skin CSS so skins always win -->
    {% block head %}{% endblock %}

    <!-- Skin CSS loads LAST: overrides all base layout -->
    <link rel="stylesheet" href="/static/skins/{{ skin }}.css">

    <style>
        /* === Minimal reset === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-body, sans-serif);
            background: var(--bg-primary, #F4F0E8);
            color: var(--text-primary, #2C2C2C);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        ul, ol { list-style: none; }

        .atmosphere {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* === Top Navigation === */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            margin-bottom: var(--space-lg, 24px);
            border-bottom: 1px solid var(--border-subtle, #e0ddd5);
            position: relative;
            z-index: 10;
        }

        .top-nav__brand {
            font-family: var(--font-display, var(--font-heading, 'Archivo Black', sans-serif));
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-primary, #E63946);
            letter-spacing: 0.02em;
        }

        .top-nav__links {
            display: flex;
            gap: var(--space-lg, 24px);
            align-items: center;
        }

        .top-nav__links a {
            font-family: var(--font-body, 'Outfit', sans-serif);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted, #999);
            transition: color 150ms ease;
            padding: 4px 0;
        }

        .top-nav__links a:hover,
        .top-nav__links a.active {
            color: var(--text-primary, #2C2C2C);
        }

        .top-nav__status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono, 'JetBrains Mono', monospace);
            font-size: 0.7rem;
            color: var(--text-muted, #999);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted, #999);
        }

        .status-dot--online { background: var(--accent-success, #2ecc71); }
        .status-dot--stale { background: var(--accent-warning, #f39c12); }
        .status-dot--offline { background: var(--text-muted, #999); }

        .page-shell {
            max-width: var(--page-max-width, 1120px);
            margin: 0 auto;
            padding: var(--page-pad-y, 24px) var(--page-pad-x, 16px);
            position: relative;
            z-index: 1;
        }
        @media (min-width: 768px) {
            .page-shell {
                padding: var(--page-pad-y-lg, 48px) var(--page-pad-x-lg, 32px);
            }
        }

        .notification-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            background: var(--accent-primary, #E63946);
            color: #fff;
            font-family: var(--font-mono, 'JetBrains Mono', monospace);
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 12px;
            padding: 0 8px;
            display: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: opacity 0.2s ease;
        }
        .notification-badge.visible { display: block; }
        .notification-badge:hover { opacity: 0.85; }

    </style>
</head>
<body class="{{ skin }}" data-skin="{{ skin }}">
    <div class="notification-badge" id="notif-badge" title="Unread notifications" onclick="window.location='/dashboard'"></div>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="page-shell">
        <nav class="top-nav">
            <a href="/" class="top-nav__brand">Promaia</a>
            <div class="top-nav__links">
                <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="/talk" class="{% if active_page == 'talk' %}active{% endif %}">Talk</a>
                <a href="/projects" class="{% if active_page == 'projects' %}active{% endif %}">Projects</a>
                <a href="/email" class="{% if active_page == 'email' %}active{% endif %}">Email</a>
                <a href="/profile" class="{% if active_page == 'profile' %}active{% endif %}">Profile</a>
            </div>
            <div class="top-nav__status" id="system-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">checking...</span>
                <a href="/logout" style="margin-left:12px;font-size:0.7rem;color:var(--text-muted,#999);">logout</a>
            </div>
        </nav>

        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
    <script>
    (function() {
        // Notification badge polling
        var badge = document.getElementById('notif-badge');
        if (badge) {
            function pollNotifs() {
                fetch('/api/notifications/unread')
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        if (d.unread > 0) {
                            badge.textContent = d.unread;
                            badge.classList.add('visible');
                        } else {
                            badge.classList.remove('visible');
                        }
                    })
                    .catch(function() {});
            }
            pollNotifs();
            setInterval(pollNotifs, 60000);
        }

        // Scheduler health indicator
        var dot = document.getElementById('status-dot');
        var text = document.getElementById('status-text');
        function pollHealth() {
            fetch('/api/scheduler/health')
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    dot.className = 'status-dot';
                    if (d.status === 'online') {
                        dot.classList.add('status-dot--online');
                        text.textContent = 'online';
                    } else if (d.status === 'stale') {
                        dot.classList.add('status-dot--stale');
                        text.textContent = Math.round(d.last_seen_minutes) + 'm ago';
                    } else {
                        dot.classList.add('status-dot--offline');
                        text.textContent = 'offline';
                    }
                })
                .catch(function() {
                    dot.className = 'status-dot status-dot--offline';
                    text.textContent = 'offline';
                });
        }
        pollHealth();
        setInterval(pollHealth, 60000);
    })();
    </script>
    <script src="/static/js/atmospherics.js" defer></script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
</body>
</html>
